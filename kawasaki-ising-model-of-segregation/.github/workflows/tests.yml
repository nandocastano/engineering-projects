name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" ruff
      - run: ruff check src tests experiments scripts
      - run: pytest -q
      - run: python -m kawasaki_ising.cli --n 20 --steps 200 --quiet --outdir /tmp/kim-out
