[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kawasaki-ising"
version = "2.0.0"
description = "Exact pair-exchange Metropolis sampling and variance-peak transition estimates for a Kawasaki-Ising model of segregation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Fernando Castaño", email = "jfc9577@nyu.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
app = ["streamlit>=1.28", "imageio>=2.31"]
test = ["pytest>=7.0"]

[project.scripts]
kawasaki-ising = "kawasaki_ising.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E501", "E741"]
